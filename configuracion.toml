# =============================================================================
#  CONFIGURACIÓN DEL TABLERO — los textos se editan AQUÍ
# =============================================================================
#
#  Este archivo controla lo que se LEE en las dos apps (prototipo B y F):
#  títulos, nombres de gráficos, filtros de la tabla y columnas de la tabla.
#  Para cambiar un texto: edita lo que está entre comillas y guarda.
#  Streamlit Cloud lo toma en la siguiente carga de la página.
#
#  No hace falta tocar ningún archivo .py.
#
#  Reglas mínimas:
#    - El texto va siempre entre comillas "así".
#    - Para NEGRITA escribe **así**. Para cursiva, *así*.
#    - No borres ni cambies los nombres de la izquierda (titulo =, subtitulo =...).
#    - Si te equivocas, la app NO se cae: muestra un aviso amarillo arriba, con
#      lo que hay que corregir, y usa el texto original mientras tanto.
#
#  Los colores NO están aquí a propósito: están validados para que las
#  categorías se distingan también con daltonismo. Ver README.
# =============================================================================


[encabezado]

# Título principal. Aparece arriba de la página y en la pestaña del navegador.
# "trashumancia" va sin la "n": así lo escribe el reglamento RE-002-DRE/001,
# cuya cita aparece en la misma pantalla.
titulo = "Denuncias registradas en el REA por casos de probable trashumancia electoral"

# Línea bajo el título.
subtitulo = "Subdirección de Procedimiento Electoral y Georreferenciación · Dirección de Registro Electoral · RENIEC"


[cita_reglamento]

# Recuadro al pie de la página. Es cita LITERAL: no cambiar el texto entre «».
nombre = "Registro de Alertas (REA)"
texto = "Registro que contiene denuncias realizadas por ciudadanos, organizaciones políticas, autoridades, de la administración pública y asociaciones civiles referidas a cambios domiciliarios irregulares. En este registro se incluyen reportes o informes remitidos por entidades de la administración pública respecto a riesgos de índole electoral, social y económica que tengan un efecto directo sobre la trashumancia electoral."
fuente = "RENIEC, *Verificación del Domicilio Declarado*, p. 6."


[prototipos]

# Etiqueta del recuadro superior derecho, para saber qué versión se está viendo.
# Si prefieres que no aparezca, deja las comillas vacías: b = ""
b = "B · coropleta departamental"
f = "F · mapa intercambiable"


[mapa]

# Selector que hay sobre el mapa (solo en la app F): alterna entre la coropleta por
# departamento (B) y el mapa por provincias y distritos (F).
selector_titulo = "Tipo de mapa"
selector_b = "B · coropleta por departamento"
selector_f = "F · provincias y distritos"

# Mapa con el que se abre la app: "b" o "f".
inicial = "f"

# Leyenda del mapa B (coropleta departamental).
leyenda_b_titulo = "Denuncias por departamento"
leyenda_b_sin_denuncias = "sin denuncias"
leyenda_b_nota = "El número impreso es el total del departamento. Al acercar aparecen los límites provinciales y distritales."

# Leyenda del mapa F: solo el tipo de denuncia.
leyenda_f_titulo = "Distrito · tipo de denuncia"
leyenda_f_nota = "El tamaño del círculo indica el número de denuncias del distrito; partido, que hay más de un tipo. El número sobre una provincia es su total. Clic en un círculo para ver de qué trata cada denuncia."

# Texto de los recuadros que aparecen al pasar el ratón por el mapa.
tooltip_departamento = "Departamento"
tooltip_provincia = "Provincia"
tooltip_distrito = "Distrito"
tooltip_denuncias = "Denuncias"


[indicadores]

# Las cinco cajas de cifras. Cada una tiene su nombre (etiqueta) y una nota
# pequeña debajo. En las notas, lo que va entre llaves { } se reemplaza solo
# por la cifra real:
#     {total}      total de denuncias del registro
#     {cobertura}  denuncias que traen listado de ciudadanos
#     {n}          total de denuncias mostradas (todas las del registro)
# Si borras o escribes mal una llave, se muestra tal cual; no pasa nada grave.

[indicadores.denuncias]
etiqueta = "Denuncias"
nota = "de {total} en el registro"

[indicadores.documentos]
etiqueta = "Documentos"
nota = "proveídos y alertas"

[indicadores.distritos]
etiqueta = "Distritos"
nota = "con al menos una denuncia"

[indicadores.departamentos]
etiqueta = "Departamentos"
nota = "de 25 a nivel nacional"

[indicadores.ciudadanos]
etiqueta = "Ciudadanos listados"
nota = "consta en {cobertura} de {n} denuncias"


[graficos.departamento]

# Barras horizontales por departamento (apiladas por tipo de denuncia).
titulo = "Denuncias por departamento"
subtitulo = "Barras apiladas por tipo: el color es el mismo que el de las burbujas del mapa."


[graficos.canal]

# Gráfico de dona con el canal por el que ingresó cada denuncia.
# "centro" es la palabra pequeña que va debajo del total, en medio de la dona.
titulo = "Canal de ingreso"
subtitulo = "Institución por la que llegó la denuncia."
centro = "denuncias"


[graficos.tiempo]

# Línea de tiempo por semana de ingreso a RENIEC.
titulo = "Denuncias por fecha de ingreso a RENIEC"
subtitulo = "Por semana (lunes a domingo). Las semanas sin denuncias se dibujan en cero, no se omiten."

# Textos que aparecen al pasar el ratón sobre un punto.
eje_semana = "Semana"
eje_denuncias = "Denuncias"

# Etiqueta del punto más alto. {n} = denuncias, {fecha} = día y mes de inicio.
pico = "{n} · semana del {fecha}"


[tabla]

# Título y explicación de la tabla de abajo.
titulo = "Detalle de denuncias"
nota = "Una fila por denuncia, de la más reciente a la más antigua. Haz clic en el encabezado de una columna para ordenarla."

# Aviso bajo los tres filtros propios de la tabla.
aviso_filtros = "Estos filtros solo cambian la tabla; el mapa y los gráficos no se modifican."

# Conteo bajo la tabla. {n} = filas mostradas, {total} = denuncias del registro.
conteo = "Se muestran {n} de {total} denuncias."

# Mensaje cuando los filtros de la tabla no dejan ninguna fila.
sin_resultados = "Ninguna denuncia coincide con los filtros de la tabla."


[tabla.filtros]

# Rótulos de las tres barras de filtro que están sobre la tabla.
departamento = "Departamento"
provincia = "Provincia"
distrito = "Distrito"
todos = "Todos"


[tabla.columnas]

# COLUMNAS DE LA TABLA. Cada línea es:   id_interno = "Nombre que se muestra"
#
#   - CAMBIAR UN NOMBRE: edita lo que está entre comillas.
#   - CAMBIAR EL ORDEN:  mueve las líneas de lugar (aparecen en este orden).
#   - OCULTAR UNA COLUMNA: borra su línea, o ponle un # delante.
#   - MOSTRAR UNA COLUMNA QUE NO ESTÁ: añade una línea con uno de estos ids
#     (que ya vienen listos abajo, con # delante; quita el # para activarlos):
#         item, fecha, departamento, provincia, distrito, ubigeo_inei, tipo,
#         documento, formato, canal, denunciante, caracter, ciudadanos, observacion
#
#   El id de la izquierda NO se cambia: es el que conecta con los datos.
#   Si escribes un id que no existe, verás un aviso con los ids válidos.

fecha = "Fecha de ingreso"
departamento = "Departamento"
provincia = "Provincia"
distrito = "Distrito"
tipo = "Tipo"
documento = "Documento"
canal = "Canal"
ciudadanos = "Ciudadanos"
observacion = "Observación"

# Columnas disponibles pero ocultas (quita el # para mostrarlas):
# item = "Ítem"
# ubigeo_inei = "Ubigeo INEI"
# formato = "Formato"
# denunciante = "Denunciante"
# caracter = "Carácter"


[tipos]

# Nombre con el que se muestra cada tipo de denuncia (mapa, gráficos y tabla).
# Solo se cambia el NOMBRE. El color de cada tipo está fijo a propósito.
impugnacion = "Impugnación"
verificacion = "Verificación"
padron = "Padrón"
suspension_de_depuracion = "Suspensión de depuración"


[canales]

# Nombre con el que se muestra cada canal de ingreso. La clave de la izquierda
# es el nombre del canal en minúsculas, sin tildes y con guion bajo en vez de
# espacios. Si en una base futura llega un canal nuevo, se agrega aquí una
# línea; mientras no esté, se muestra tal como viene en el Excel.
reniec = "RENIEC"
ministerio_publico = "Ministerio Público"
defensoria_del_pueblo = "Defensoría del Pueblo"


[ajustes]

# Alto del mapa en píxeles (entre 400 y 2000). Si el mapa queda más corto o más
# largo que la columna de gráficos de su derecha, ajusta este número.
altura_mapa = 960

# Alto de las tarjetas de "Denuncias por departamento" y "Canal de ingreso" (entre
# 400 y 2000). Las dos miden lo mismo para que queden alineadas. Si hay muchos
# departamentos, la tarjeta se desplaza por dentro en vez de crecer.
altura_tarjetas = 540
